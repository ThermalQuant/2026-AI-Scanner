name: Daily Morning Market Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'   # Runs at 9:30 AM Eastern Time (13:30 UTC)

jobs:
  market_scan:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Get the Files
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Tools
        run: |
          pip install pandas yfinance numpy pandas_ta gspread

      - name: 4. Run the Scanner
        run: python get_stocks.py

      - name: 5. Append to Google Sheets
        env:
          GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python update_sheet.py
