name: Market Scan and Update Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # This tells the computer: "Check for updates every 5 minutes"

jobs:
  market_scan:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Get the Files
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Tools
        run: |
          pip install pandas yfinance numpy
          pip install pandas_ta --no-dependencies

      - name: 4. Run the Scanner
        run: python get_stocks.py
        
      - name: 5. Send to Google Sheets
        uses: jroehl/gsheet.action@v1.0.0
        with:
          spreadsheetId: ${{ secrets.SPREADSHEET_ID }}
          commands: |
            [
              {
                "command": "update",
                "args": {
                  "worksheet": "Raw Data",
                  "data": "MarketData_Pro.csv",   # Make sure this matches the exact filename your Python script actually saves
                  "minCol": 1
                }
              }
            ]
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
