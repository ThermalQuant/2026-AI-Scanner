name: Market Scan and Update Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1-5' # Runs at 10 AM EST every weekday

jobs:
  market_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance numpy
          pip install pandas_ta --no-dependencies

      - name: Run Market Scanner
        run: python get_stocks.py

      - name: Write to Google Sheets
        uses: jroehl/gsheet.action@v1.0.0
        with:
          spreadsheetId: ${{ secrets.SPREADSHEET_ID }}
          commands: |
            [
              {
                "command": "update",
                "args": {
                  "worksheet": "Raw Data",
                  "data": "MarketData_Pro.csv",
                  "minCol": 1
                }
              }
            ]
        env:
          GSHEET_CREDENTIALS: ${{ secrets.GSHEET_CREDENTIALS }}
